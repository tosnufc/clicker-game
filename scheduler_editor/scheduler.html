<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheduler Calendar</title>
  <style>
    :root { --line-color: #fff; --line-width: 1px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; padding: 4px; }
    .top { flex-shrink: 0; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .top h1 { flex-shrink: 0; }
    .palette { flex: 1; margin: 0; }
    .top-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    h1 { margin: 0; font-size: 0.9rem; }
    .hint { color: #94a3b8; font-size: 10px; margin: 0; }
    .calendar-wrap { flex: 1; min-height: 0; overflow: auto; border-radius: 8px; }
    .calendar { display: grid; grid-template-columns: 36px repeat(7, 1fr); column-gap: var(--line-width); row-gap: var(--line-width); padding: 0; background: var(--line-color); }
    .cell { min-height: 11px; padding: 0 2px; background: #252d42; font-size: 8px; }
    .cell.header { background: #0f3460; font-weight: 600; text-align: center; padding: 1px; position: sticky; top: 0; z-index: 1; font-size: 8px; line-height: 1.1; }
    .cell.header.corner { left: 0; z-index: 2; }
    .cell.time { background: #0f3460; font-size: 8px; padding: 0 1px; position: sticky; left: 0; z-index: 1; }
    .cell.droppable { min-height: 12px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1px; }
    .chip { display: inline-block; padding: 0 3px; margin: 0; border-radius: 1px; font-size: 7px; cursor: grab; user-select: none; order: 1; }
    .chip:active { cursor: grabbing; }
    .chip.dragging { opacity: 0.5; }
    .chip { position: relative; }
    .chip-del { display: none; margin-left: 2px; padding: 0 2px; cursor: pointer; font-size: 10px; color: #fff; opacity: 0.8; }
    .chip:hover .chip-del { display: inline; }
    .chip-del:hover { opacity: 1; }
    .chip.claim_8-hrs { background: #e94560; }
    .chip.claim_daily { background: #533483; }
    .chip.prime_recruitment_30 { background: #5a9fd4; }
    .chip.boomer { background: #2d6a4f; }
    .chip.auto_join { background: #f4a261; color: #1a1a2e; }
    .chip.soldiers_popping { background: #457b9d; }
    .prep-label { font-size: 7px; color: #2d3748; margin-bottom: 0; line-height: 1; font-weight: bold; margin-left: auto; text-align: right; order: 2; }
    .prep-shelter { background: #a8d4ed !important; }
    .prep-science { background: #b8e5c4 !important; }
    .prep-vehicle { background: #f0e0a8 !important; }
    .prep-hero { background: #f0c4dc !important; }
    .prep-army { background: #dcc4f0 !important; }
    .palette { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px 8px; background: #0f3460; border-radius: 4px; }
    .palette-label { font-size: 9px; color: #94a3b8; margin-right: 4px; }
    .palette .chip { cursor: grab; }
    button { padding: 3px 8px; border: none; border-radius: 3px; font-size: 10px; cursor: pointer; }
    button.save { background: #2d6a4f; color: white; }
    button.save:hover { background: #40916c; }
    button.exit { background: #e94560; color: white; }
    button.exit:hover { background: #ff6b6b; }
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      min-height: 24px;
      padding: 2px 4px;
      box-sizing: border-box;
      text-align: center;
      border-radius: 4px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
    }
    .status.saving { color: #e94560; }
    .status.saved { color: #fff; background: rgba(45, 106, 79, 0.25); }
    .status.saved.sync-fail { color: #fff; background: rgba(233, 69, 96, 0.22); }
    .status.ok { color: #fff; background: rgba(45, 106, 79, 0.25); }
    .status.err { color: #e94560; background: rgba(233, 69, 96, 0.22); }
    .tz-wrap {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      font-size: 7px;
      color: #94a3b8;
    }
    .tz-wrap select {
      width: auto;
      max-width: 30ch;
      min-width: 0;
      padding: 1px 2px;
      font-size: 7px;
      line-height: 1.2;
      border-radius: 2px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      box-sizing: border-box;
    }
    .tz-wrap select option {
      font-size: 7px;
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>Scheduler Calendar</h1>
    <div class="palette" id="palette"></div>
    <div class="top-right">
      <label class="tz-wrap">Timezone
        <select id="tzDisplay" title="Display timezone (view-only; does not change scheduler.json)"></select>
      </label>
      <button class="save" onclick="save()">Save</button>
      <button class="exit" onclick="exitServer()">Exit</button>
      <span class="status" id="status"></span>
    </div>
  </div>
  <div class="calendar-wrap">
    <div class="calendar" id="calendar"></div>
  </div>

  <script>
    const BAT_MAP = {
      'claim_8-hrs': 'claim_8-hrs_workflow.bat',
      'claim_daily': 'claim_daily_workflow.bat',
      'prime_recruitment_30': 'prime_recruitment_30_workflow.bat',
      'boomer': 'boomer_workflow.bat',
      'auto_join': 'auto_join_workflow.bat',
      'soldiers_popping': 'soldiers_popping_workflow.bat'
    };
    const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const VERSUS = { 1:'Mod Vehicle Boost', 2:'Shelter Upgrade', 3:'Age of Science', 4:'Hero Initiative', 5:'Holistic Growth', 6:'Enemy Buster', 0:'N/A' };
    const PREP_EVENTS = {
      1: {'09:00':'Shelter Upgrade','13:00':'Age of Science','17:00':'Mod Vehicle Boost','21:00':'Hero Initiative','01:00':'Army Expansion','05:00':'Mod Vehicle Boost'},
      2: {'09:00':'Age of Science','13:00':'Hero Initiative','17:00':'Shelter Upgrade','21:00':'Army Expansion','01:00':'Mod Vehicle Boost','05:00':'Shelter Upgrade'},
      3: {'09:00':'Hero Initiative','13:00':'Army Expansion','17:00':'Age of Science','21:00':'Mod Vehicle Boost','01:00':'Shelter Upgrade','05:00':'Age of Science'},
      4: {'09:00':'Army Expansion','13:00':'Mod Vehicle Boost','17:00':'Hero Initiative','21:00':'Shelter Upgrade','01:00':'Age of Science','05:00':'Hero Initiative'},
      5: {'09:00':'Mod Vehicle Boost','13:00':'Shelter Upgrade','17:00':'Army Expansion','21:00':'Age of Science','01:00':'Hero Initiative','05:00':'Army Expansion'},
      6: {'09:00':'Age of Science','13:00':'Mod Vehicle Boost','17:00':'Hero Initiative','21:00':'Shelter Upgrade','01:00':'Army Expansion','05:00':'Hero Initiative'},
      0: {'09:00':'Mod Vehicle Boost','13:00':'Shelter Upgrade','17:00':'Army Expansion','21:00':'Age of Science','01:00':'Hero Initiative','05:00':'Army Expansion'}
    };
    let data = { workflows: [] };

    const PREP_COLORS = {
      'Shelter Upgrade': 'prep-shelter',
      'Age of Science': 'prep-science',
      'Mod Vehicle Boost': 'prep-vehicle',
      'Hero Initiative': 'prep-hero',
      'Army Expansion': 'prep-army'
    };

    function getBlockStart(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      const mins = h * 60 + m;
      if (mins < 60) return '21:00';
      if (mins < 300) return '01:00';
      if (mins < 540) return '05:00';
      if (mins < 780) return '09:00';
      if (mins < 1020) return '13:00';
      if (mins < 1260) return '17:00';
      return '21:00';
    }

    function getPrepEvent(day, timeStr) {
      const block = getBlockStart(timeStr);
      return PREP_EVENTS[day] && PREP_EVENTS[day][block];
    }

    function parseTime(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }
    function formatTime(m) {
      const h = Math.floor(m / 60), mn = m % 60;
      return `${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;
    }

    const LS_REF_TZ = 'scheduler_ref_tz';
    const LS_DISPLAY_TZ = 'scheduler_display_tz';

    function getRefTz() {
      let r = localStorage.getItem(LS_REF_TZ);
      if (!r) {
        r = Intl.DateTimeFormat().resolvedOptions().timeZone;
        localStorage.setItem(LS_REF_TZ, r);
      }
      return r;
    }

    function getDisplayTz() {
      const sel = document.getElementById('tzDisplay');
      if (sel && sel.value) return sel.value;
      return localStorage.getItem(LS_DISPLAY_TZ) || getRefTz();
    }

    function ymdInTz(ms, tz) {
      return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms));
    }

    function hmInTz(ms, tz) {
      const s = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ms));
      const parts = s.match(/(\d{1,2}):(\d{2})/);
      if (!parts) return s;
      return `${String(parts[1]).padStart(2, '0')}:${parts[2]}`;
    }

    function hmToMinutes(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function getYmdPartsInTz(tz) {
      const s = ymdInTz(Date.now(), tz);
      return s.split('-').map(Number);
    }

    /** UTC ms where wall clock in `tz` is hh:mm on (y, mo, d). */
    function findUtcForWallClock(y, mo, d, hhmm, tz) {
      const target = hmToMinutes(hhmm);
      const want = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      let lo = Date.UTC(y, mo - 1, d - 1);
      let hi = Date.UTC(y, mo - 1, d + 2);
      for (let iter = 0; iter < 56; iter++) {
        const mid = Math.floor((lo + hi) / 2);
        const dayStr = ymdInTz(mid, tz);
        const hm = hmInTz(mid, tz);
        const cur = hmToMinutes(hm);
        if (dayStr < want) {
          lo = mid + 1;
          continue;
        }
        if (dayStr > want) {
          hi = mid - 1;
          continue;
        }
        if (cur < target) lo = mid + 1;
        else if (cur > target) hi = mid - 1;
        else return mid;
      }
      return Math.floor((lo + hi) / 2);
    }

    /** Label for left column only; `canonicalHHMM` stays the scheduler.json value. */
    function displayTimeLabel(canonicalHHMM) {
      const refTz = getRefTz();
      const dispTz = getDisplayTz();
      if (refTz === dispTz) return canonicalHHMM;
      try {
        const [y, mo, d] = getYmdPartsInTz(refTz);
        const utcMs = findUtcForWallClock(y, mo, d, canonicalHHMM, refTz);
        return hmInTz(utcMs, dispTz);
      } catch (_) {
        return canonicalHHMM;
      }
    }

    /** e.g. GMT+9, GMT-5, GMT+05:30 — from Intl (current date, reflects DST). */
    function formatGmtOffsetLabel(tz) {
      try {
        const fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'longOffset' });
        const parts = fmt.formatToParts(new Date());
        return parts.find(p => p.type === 'timeZoneName')?.value || 'GMT';
      } catch (_) {
        return 'GMT';
      }
    }

    /** Minutes east of UTC (e.g. Tokyo +540); used for sorting. */
    function offsetMinutesEastOfUtc(tz) {
      try {
        const fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'longOffset' });
        const name = fmt.formatToParts(new Date()).find(p => p.type === 'timeZoneName')?.value || '';
        const m = name.match(/(?:GMT|UTC)([+-])(\d{1,2})(?::(\d{2}))?/);
        if (!m) return 0;
        const sign = m[1] === '+' ? 1 : -1;
        const hh = parseInt(m[2], 10);
        const mm = m[3] ? parseInt(m[3], 10) : 0;
        return sign * (hh * 60 + mm);
      } catch (_) {
        return 0;
      }
    }

    function initTzSelect() {
      const sel = document.getElementById('tzDisplay');
      if (!sel) return;
      let zones = [];
      try {
        if (typeof Intl.supportedValuesOf === 'function') {
          zones = Intl.supportedValuesOf('timeZone');
        }
      } catch (_) {}
      if (!zones.length) {
        zones = ['UTC', 'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles', 'Europe/London', 'Asia/Tokyo', 'Asia/Shanghai', 'Australia/Sydney'];
      }
      getRefTz();
      const disp = localStorage.getItem(LS_DISPLAY_TZ) || getRefTz();
      const zoneSet = new Set(zones);
      zoneSet.add(disp);
      const rows = [...zoneSet].map(z => ({
        z,
        off: offsetMinutesEastOfUtc(z),
        gmt: formatGmtOffsetLabel(z)
      }));
      rows.sort((a, b) => (a.off !== b.off ? a.off - b.off : a.z.localeCompare(b.z)));
      rows.forEach(({ z, gmt }) => {
        const opt = document.createElement('option');
        opt.value = z;
        opt.textContent = `${z} (${gmt})`;
        sel.appendChild(opt);
      });
      sel.value = disp;
      sel.addEventListener('change', () => {
        localStorage.setItem(LS_DISPLAY_TZ, sel.value);
        render();
      });
    }

    function renderPalette() {
      const palette = document.getElementById('palette');
      palette.innerHTML = '<span class="palette-label">Workflows:</span>';
      Object.keys(BAT_MAP).forEach(workflow => {
        const chip = document.createElement('span');
        chip.className = `chip ${workflow}`;
        chip.textContent = workflow;
        chip.draggable = true;
        chip.dataset.workflow = workflow;
        chip.dataset.bat = BAT_MAP[workflow];
        chip.addEventListener('dragstart', onDragStart);
        palette.appendChild(chip);
      });
    }

    function load() {
      fetch('scheduler.json?t=' + Date.now()).then(r => r.json()).then(d => {
        data = d;
        const expanded = [];
        (data.workflows || []).forEach((w, i) => {
          const id = w.id != null ? w.id : `w${i}-${Date.now()}`;
          if (w.day === null) {
            for (let day = 0; day < 7; day++) {
              expanded.push({ ...w, id: `${id}-d${day}`, day });
            }
          } else {
            expanded.push({ ...w, id: w.id || id });
          }
        });
        data.workflows = expanded;
        renderPalette();
        render();
      }).catch(() => {
        data = { workflows: [] };
        renderPalette();
        render();
      });
    }

    let dragData = null;
    function onDragStart(e) {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      dragData = {
        id: chip.dataset.id || null,
        workflow: chip.dataset.workflow,
        bat: chip.dataset.bat,
        day: chip.dataset.day !== undefined ? (chip.dataset.day === 'all' ? null : parseInt(chip.dataset.day)) : null,
        time: chip.dataset.time || null
      };
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', chip.dataset.workflow);
    }
    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }
    function onDrop(e) {
      e.preventDefault();
      document.querySelectorAll('.chip.dragging').forEach(c => c.classList.remove('dragging'));
      if (!dragData) return;
      const day = parseInt(e.currentTarget.dataset.day);
      const time = e.currentTarget.dataset.time;
      if (dragData.id != null) {
        const idx = data.workflows.findIndex(w => w.id === dragData.id);
        if (idx >= 0) {
          data.workflows[idx] = { ...data.workflows[idx], day: day, time: time };
        }
      } else {
        data.workflows.push({
          id: `w${Date.now()}`,
          workflow: dragData.workflow,
          bat: dragData.bat,
          day: day,
          time: time
        });
      }
      dragData = null;
      render();
    }
    document.addEventListener('dragend', () => {
      document.querySelectorAll('.chip.dragging').forEach(c => c.classList.remove('dragging'));
      dragData = null;
    });

    function save() {
      const status = document.getElementById('status');
      const saveBtn = document.querySelector('button.save');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      status.textContent = 'Saving';
      status.className = 'status saving';

      // Ensure the browser repaints "Saving" before we do any work or start waiting on the server.
      setTimeout(() => {
        const collapsed = [];
        const byKey = {};
        data.workflows.forEach(w => {
          const key = `${w.workflow}|${w.bat}|${w.time}`;
          if (!byKey[key]) byKey[key] = [];
          byKey[key].push(w);
        });
        Object.values(byKey).forEach(group => {
          const days = group.map(w => w.day).filter(d => d != null);
          const allDays = days.length === 7 && new Set(days).size === 7;
          if (allDays && group.length === 7) {
            collapsed.push({ workflow: group[0].workflow, bat: group[0].bat, day: null, time: group[0].time });
          } else {
            group.forEach(w => {
              const { id, ...rest } = w;
              collapsed.push(rest);
            });
          }
        });

        fetch('/save_scheduler', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workflows: collapsed })
        }).then(async r => {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save';
          if (!r.ok) {
            status.textContent = 'Save failed.';
            status.className = 'status err';
            try { await r.json(); } catch (_) {}
            return;
          }
          let j = {};
          try { j = await r.json(); } catch (_) {}
          if (j.sync === false || j.restart === false) {
            status.textContent = 'Saved';
            status.className = 'status saved sync-fail';
          } else {
            status.textContent = 'Saved';
            status.className = 'status saved';
          }
        }).catch(() => {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save';
          status.textContent = 'Run scheduler_server.py to enable save.';
          status.className = 'status err';
        });
      }, 0);
    }

    function exitServer() {
      if (!confirm('Stop the scheduler server?')) return;
      const status = document.getElementById('status');
      fetch('/exit').then(() => { status.textContent = 'Server stopped.'; status.className = 'status ok'; window.close(); }).catch(() => {});
    }

    function render() {
      const cal = document.getElementById('calendar');
      cal.innerHTML = '';
      cal.style.display = 'grid';
      cal.style.gridTemplateColumns = '36px repeat(7, 1fr)';
      const times = [];
      for (let m = 9 * 60; m < 24 * 60; m += 30) times.push(formatTime(m));
      for (let m = 0; m < 9 * 60; m += 30) times.push(formatTime(m));
      const corner = document.createElement('div');
      corner.className = 'cell header corner';
      cal.appendChild(corner);
      DAYS.forEach((d, i) => {
        const h = document.createElement('div');
        h.className = 'cell header';
        const day = (i + 1) % 7;
        h.textContent = d + ' - ' + (VERSUS[day] || '');
        cal.appendChild(h);
      });
      times.forEach(timeStr => {
        const tc = document.createElement('div');
        tc.className = 'cell time';
        tc.textContent = displayTimeLabel(timeStr);
        tc.title = timeStr + ' (stored)';
        cal.appendChild(tc);
        for (let col = 0; col < 7; col++) {
          const day = (col + 1) % 7;
          const cell = document.createElement('div');
          cell.className = 'cell droppable';
          cell.dataset.day = day;
          cell.dataset.time = timeStr;
          const prep = getPrepEvent(day, timeStr);
          if (prep) {
            const colorClass = PREP_COLORS[prep];
            if (colorClass) cell.classList.add(colorClass);
            if (timeStr === getBlockStart(timeStr)) {
              const lbl = document.createElement('div');
              lbl.className = 'prep-label';
              lbl.textContent = prep;
              cell.appendChild(lbl);
            }
          }
          data.workflows.filter(w =>
            w.day === day && w.time === timeStr
          ).forEach(w => {
            const chip = document.createElement('span');
            chip.className = `chip ${w.workflow}`;
            chip.innerHTML = w.workflow + '<span class="chip-del" title="Delete">×</span>';
            chip.draggable = true;
            chip.dataset.id = w.id;
            chip.dataset.workflow = w.workflow;
            chip.dataset.bat = w.bat;
            chip.dataset.day = w.day === null ? 'all' : String(w.day);
            chip.dataset.time = w.time;
            chip.addEventListener('dragstart', onDragStart);
            chip.querySelector('.chip-del').addEventListener('mousedown', (e) => e.stopPropagation());
            chip.querySelector('.chip-del').addEventListener('click', (e) => {
              e.stopPropagation();
              e.preventDefault();
              const idx = data.workflows.findIndex(x => x.id === w.id);
              if (idx >= 0) { data.workflows.splice(idx, 1); render(); }
            });
            cell.appendChild(chip);
          });
          cell.addEventListener('dragover', onDragOver);
          cell.addEventListener('drop', onDrop);
          cal.appendChild(cell);
        }
      });
    }

    initTzSelect();
    load();
  </script>
</body>
</html>
